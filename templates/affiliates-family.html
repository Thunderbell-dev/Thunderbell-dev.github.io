<body>
    <div class="affiliates-container">
        <div class="affiliates-title">
            <h1 id="md-title"></h1>
        </div>
        <div class="affiliates-content" id="md-content"></div>
    </div>

<script>
    fetch('https://raw.githubusercontent.com/thunderbell-dev/thunderbell-dev.github.io/main/pages/affiliates/family-text/MARKDOWN-NAME') 
        .then(response => response.text())
        .then(text => {
            const metadataMatch = text.match(/^---([\s\S]*?)---/);
            let metadata = {};

            if (metadataMatch) {
                const metaLines = metadataMatch[1].trim().split("\n");
                metaLines.forEach(line => {
                    const [key, ...value] = line.split(": ");
                    metadata[key.trim()] = value.join(": ").trim();
                });
                text = text.replace(metadataMatch[0], "").trim();
            }

  
            if (metadata.title) {
                document.getElementById("md-title").innerText = metadata.title;
            }

     
            const container = document.querySelector('body');
            if (metadata.image) {
                container.style.backgroundImage = `url(${metadata.image})`;  // Set the image as background
            }

            // Split content at each "## " (H2) while keeping the delimiter
            const sections = text.split(/(?=## )/).map(section => section.trim()).filter(Boolean);

            // Select the content container
            const contentContainer = document.getElementById('md-content');


            // Loop through each section and create a content card
            sections.forEach((section, index) => {
                // Create the content card
                const card = document.createElement('div');
                card.classList.add('content-card'); // Add the content-card class

                // Assign unique ID to each card
                card.id = `content-card-${index}`;

                // Set the inner HTML to the parsed markdown content
                card.innerHTML = marked.parse(section);

                // Alternate the alignment for each card
                if (index % 2 === 0) {
                    const emptyCardAfterLeft = document.createElement('div');
                    emptyCardAfterLeft.classList.add('content-card', 'empty');
                    contentContainer.appendChild(emptyCardAfterLeft);
                } else {
               
                }

                // Append the card to the content container
                contentContainer.appendChild(card);
            });
        })
        .catch(error => console.error('Error loading markdown:', error));
</script>
