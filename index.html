<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purrfactory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="components/header.css">
    <link rel="stylesheet" href="components/footer.css">
    <link rel="stylesheet" href="components/stage-picture.css">
    <link rel="stylesheet" href="components/family-team.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="header-section header-section-a">
                <img src="/images/new-pictures/Wonderland.png" alt="Purrfactory Logo" class="logo">
            </div>
            <div class="header-section header-section-b">
                <h1>Purrfactory</h1>
            </div>
            <div class="header-section header-section-c"></div>
        </div>
        <nav>
            <a href="/pages/guides/index.html">Guides</a>
            <a href="/pages/art/index.html">Art Gallery</a>
            <a href="/pages/news/index.html">News</a>
            <a href="/pages/achievements/index.html">Achievements</a>
        </nav>
    </header>
    
    <div class="stage-container">
        <div class="stage-pic">
            <img src="/images/new-pictures/Berios_Crew.png" alt="Guild Image">
        </div>
        <h2> Our big cats </h2>
        <div class="role-container">
            <div class="role-box">
                <i class="fa-solid fa-paw"></i>
                <h3>Captain</h3>
                <div class="player-box">
    
                    <div class="player-row">
                        <div class="player-icon"><i class="fas fa-gamepad"></i></div>
                        <div class="player-name">Tempestieg</div>
                    </div>
                    
                    <div class="player-row">
                        <div class="player-icon"><i class="fas fa-user"></i></div>
                        <div class="player-name">Temp, Stieg</div>
                    </div>   
                </div>
            </div>
            <div class="role-box">
                <i class="fa-solid fa-cat"></i>
                <h3>Deputies</h3>
                <div class="player-box">

                    <div class="player-row">
                        <div class="player-icon"><i class="fas fa-gamepad"></i></div>
                        <div class="player-name">Thunderbell</div>
                    </div>
                    
                    <div class="player-row">
                        <div class="player-icon"><i class="fas fa-user"></i></div>
                        <div class="player-name">Thunder</div>
                    </div> 
                </div>
                <div class="player-box">

                    <div class="player-row">
                        <div class="player-icon"><i class="fas fa-gamepad"></i></div>
                        <div class="player-name">VitaVate</div>
                    </div>
                    
                    <div class="player-row">
                        <div class="player-icon"><i class="fas fa-user"></i></div>
                        <div class="player-name">Langëd</div>
                    </div>   
                </div>
            </div>
            <div class="role-box">
                <i class="fa-solid fa-shield-cat"></i>
                <h3>Keepers</h3>
                <div class="player-box">

                    <div class="player-row">
                        <div class="player-icon"><i class="fas fa-gamepad"></i></div>
                        <div class="player-name">---</div>
                    </div>
                    
                    <div class="player-row">
                        <div class="player-icon"><i class="fas fa-user"></i></div>
                        <div class="player-name">---</div>
                    </div>   
                </div>
            </div>
        </div>
    </div>  



    <footer>
        <div class="footer footer-container">
            <div class="footer-text">
                Contact us via Discord: <a href="https://discord.com/channels/@me" class="hyperlink">tempestieg | todes_ritter | langed</a>
            </div>
            <div class="footer-text">
                &copy; 2025 Purrfactory. All rights reserved.
            </div>
        </div>
    </footer>
        
</body>
</html>
