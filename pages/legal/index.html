<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purrfactory</title>
    <link rel="icon" type="image/png" href="/images/public/Kitten.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet" href="/components/header.css">
    <link rel="stylesheet" href="/components/footer.css">
    <link rel="stylesheet" href="/components/stage.css">
    <link rel="stylesheet" href="/components/custom/legal.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<header>
    <div class="header-container">
        <div class="header-section header-section-a">
            <a href="../../index.html">
                <img src="/images/public/Kitten.png" alt="Purrfactory Logo" class="logo">
            </a>
        </div>
        <div class="header-section header-section-b">
            <h1 id="main-title">Purrfactory</h1>
        </div>
        <div class="header-section header-section-c"></div>
    </div>
    <nav>
        <a href="/pages/guides/index.html">Guides</a>
        <a href="/pages/art/index.html">Art Gallery</a>
        <a href="/pages/news/index.html">News</a>
        <a href="/pages/achievements/index.html">Achievements</a>
    </nav>
</header>

<body>
    <div class="stage-container">
        <a href="legal.md" id="legal-link">
            <div id="legal-content">Loading...</div>
        </a>
    </div>

    <script>
        fetch('legal.md')
            .then(response => {
                if (!response.ok) throw new Error('Markdown file not found');
                return response.text();
            })
            .then(text => {
                // Insert the Markdown content
                document.getElementById('legal-content').innerHTML = marked.parse(text);

                // Remove the <a> tag wrapper (fallback is not needed anymore)
                let legalLink = document.getElementById('legal-link');
                let legalContent = document.getElementById('legal-content');

                // Replace <a> with just the content
                legalLink.replaceWith(legalContent);
            })
            .catch(error => {
                console.error("Error loading Markdown:", error);
                document.getElementById('legal-content').innerHTML = "Click here to view the legal disclaimer.";
            });
    </script>
</body>
