<body>
    <div class="stage-container">
        <div class="article-container">
            <div class="article-title">
                <h1 id="md-title"></h1>
                <div id="md-date" class="article-date"></div>
            </div>
            <div class="article-image">
                <img id="md-image" src="" alt="article-image">
            </div>
            <div class="article-content">
                <div id="md-content"></div>
            </div>
        </div>
    </div>

    <script>
        function formatDate(dateString) {
            const date = new Date(dateString);
            if (isNaN(date)) return ''; // Handle invalid date
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}.${month}.${year}`;
        }

        fetch('../articles/doodles.md') // Ensure correct file path
            .then(response => response.text())
            .then(text => {
                // Extract metadata (title, image, date)
                const metadataMatch = text.match(/^---([\s\S]*?)---/);
                let metadata = {};
                if (metadataMatch) {
                    const metaLines = metadataMatch[1].trim().split("\n");
                    metaLines.forEach(line => {
                        const [key, ...value] = line.split(": ");
                        metadata[key.trim()] = value.join(": ").trim();
                    });
                    text = text.replace(metadataMatch[0], "").trim(); // Remove metadata from content
                }

                // Set title and image
                if (metadata.title) document.getElementById("md-title").innerText = metadata.title;
                if (metadata.image) document.getElementById("md-image").src = metadata.image;

                // Format and display the date
                if (metadata.date) {
                    const dateElement = document.getElementById("md-date");
                    const formattedDate = formatDate(metadata.date);
                    if (formattedDate) dateElement.innerText = `Published on: ${formattedDate}`;
                }

                // Render markdown content
                document.getElementById('md-content').innerHTML = marked.parse(text);
            })
            .catch(error => console.error('Error loading markdown:', error));
    </script>

    </div>
