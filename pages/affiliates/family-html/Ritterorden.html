<body>
    <div class="stage-container">
        <div class="affiliates-container">
            <div class="affiliates-title">
                <h1 id="md-title"></h1>
            </div>
            <div class="affiliates-content">
                <div id="md-content"></div>
            </div>
        </div>
    </div>
    <script>
        fetch('../family-text/Ritterorden.md') // Ensure correct file path
            .then(response => response.text())
            .then(text => {
                // Extract metadata (title, image)
                const metadataMatch = text.match(/^---([\s\S]*?)---/);
                let metadata = {};
                if (metadataMatch) {
                    const metaLines = metadataMatch[1].trim().split("\n");
                    metaLines.forEach(line => {
                        const [key, ...value] = line.split(": ");
                        metadata[key.trim()] = value.join(": ").trim();
                    });
                    text = text.replace(metadataMatch[0], "").trim(); // Remove metadata from content
                }

                // Set title if it exists
                if (metadata.title) {
                    document.getElementById("md-title").innerText = metadata.title;
                }

                // Set image as background
                const container = document.querySelector('.affiliates-container');
                if (metadata.image) {
                    container.style.backgroundImage = `url(${metadata.image})`;  // Set the image as background
                }

                // Render markdown content
                document.getElementById('md-content').innerHTML = marked.parse(text);
            })
            .catch(error => console.error('Error loading markdown:', error));
    </script>  
</body>
